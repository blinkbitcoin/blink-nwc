extend schema @link(url: "https://specs.apollo.dev/federation/v2.3", import: ["@key", "@shareable", "@interfaceObject"])

type Query {
    hello: String!
    nwcServiceInfo: NwcServiceInfo!
    nwcPermissionPresets: [NwcPermissionPreset!]!
    nwcKnownApp(pubkey: String!): NwcKnownApp
    nwcConnection(id: ID!): NwcConnection
    nwcConnections(includeRevoked: Boolean = false): [NwcConnection!]!
}
scalar UserId
scalar AccountId
scalar WalletId
scalar Timestamp
interface Error
{
    code: String
    message: String!
    path: [String]
}
type GraphQLApplicationError implements Error @shareable
{
    code: String
    message: String!
    path: [String]
}

extend type User @key(fields: "id") {
    id: ID!
    exampleField: String
    nwcConnection(id: ID!): NwcConnection
    nwcConnections(includeRevoked: Boolean): [NwcConnection!]!
}

type Mutation {
    nwcConnectionCreate(input: NwcConnectionCreateInput!): NwcConnectionCreatePayload!
    nwcConnectionUpdate(input: NwcConnectionUpdateInput!): NwcConnectionUpdatePayload!
    nwcConnectionDelete(input: NwcConnectionDeleteInput!): NwcConnectionDeletePayload!
    nwcConnectionRevoke(input: NwcConnectionRevokeInput!): NwcConnectionRevokePayload!
    nwcConnectionsRevokeAll: NwcConnectionRevokeAllPayload!
    nwcConnectionRevokeAll: NwcConnectionRevokeAllPayload!
}

type NwcServiceInfo {
    serverPubkey: String!
    supportedMethods: [Nip47Method!]!
    supportedNotifications: [NwcNotificationType!]!
    relayUrl: String!
}

type NwcPermissionPreset {
    id: NwcPermissionPresetId!
    name: String!
    description: String!
    permissions: [NwcPermission!]!
}

enum NwcPermissionPresetId {
    SATSBACK_USER
    SATSBACK_MERCHANT
    NOSTR_ZAPPER
    READ_ONLY
}

type NwcKnownApp {
    pubkey: String!
    name: String!
    iconUrl: String
    description: String!
    recommendedPreset: NwcPermissionPreset!
}

type NwcConnection @key(fields: "id") {
    id: ID!

    userId: UserId!
    accountId: AccountId!
    walletId: WalletId!
    walletCurrency: WalletCurrency!

    alias: String
    appPubkey: String!
    permissions: [NwcPermission!]!
    budget: NwcBudget

    revoked: Boolean!
    expiresAt: Timestamp
    revokedAt: Timestamp
    lastUsedAt: Timestamp

    createdAt: Timestamp!
    updatedAt: Timestamp!
}

enum WalletCurrency {
    BTC
    USD
}

enum Nip47Method {
    GET_INFO
    GET_BALANCE
    MAKE_INVOICE
    PAY_INVOICE
    LOOKUP_INVOICE
    LIST_TRANSACTIONS
}

enum NwcPermission {
    GET_INFO
    GET_BALANCE
    MAKE_INVOICE
    PAY_INVOICE
    LOOKUP_INVOICE
    LIST_TRANSACTIONS
    NOTIFICATIONS_PAYMENT_SENT
    NOTIFICATIONS_PAYMENT_RECEIVED
}

enum NwcNotificationType {
    PAYMENT_SENT
    PAYMENT_RECEIVED
}

type NwcBudget {
    amountSats: Int!
    period: NwcBudgetPeriod!
    usedSats: Int!
    remainingSats: Int!
    resetsAt: Timestamp
}

enum NwcBudgetPeriod {
    DAILY
    WEEKLY
    MONTHLY
    NEVER
}

input NwcConnectionCreateInput {
    nwcUri: String!
    walletId: WalletId
    alias: String
    permissions: [NwcPermission!]!
    budget: NwcBudgetInput
    expiresAt: Timestamp
}

input NwcConnectionUpdateInput {
    connectionId: ID!
    alias: String
    budget: NwcBudgetInput
}

input NwcBudgetInput {
    amountSats: Int!
    period: NwcBudgetPeriod!
}

input NwcConnectionDeleteInput {
    connectionId: ID!
}

input NwcConnectionRevokeInput {
    connectionId: ID!
}

type NwcConnectionCreatePayload {
    errors: [Error!]!
    connection: NwcConnection
    connectionUri: String
}

type NwcConnectionUpdatePayload {
    errors: [Error!]!
    connection: NwcConnection
}

type NwcConnectionDeletePayload {
    errors: [Error!]!
    success: Boolean!
}

type NwcConnectionRevokePayload {
    errors: [Error!]!
    success: Boolean!
    connection: NwcConnection
}

type NwcConnectionRevokeAllPayload {
    errors: [Error!]!
    revokedCount: Int!
}
