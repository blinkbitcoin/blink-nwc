# This configuration file tells GraphQL Code Generator how
# to generate types based on our schema.
schema:
  - "./src/graphql/schema.graphql"
generates:
  # Specify where our generated types should live.
  ./src/graphql/__generated__/resolvers-types.ts:
    plugins:
      - "typescript"
      - "typescript-resolvers"
    config:
      enumsAsConst: true
      useIndexSignature: true
      resolverTypeWrapperSignature: 'T'
      enumValues:
        Nip47Method: '@/domain/nostr/index.types#Nip47MethodType'
        NwcNotificationType: '@/domain/nostr/notification-type#NwcNotificationTypeValue'
      mappers:
        GraphQLApplicationError: '@/graphql/index.types#IError'
